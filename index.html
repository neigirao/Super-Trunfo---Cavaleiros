<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cavaleiros dos Elementos · A tabela periódica como campo de batalha</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Spectral:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      h1, h2, h3, .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      /* Card Animation Styles */
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0) scale(1); }
        20%, 80% { transform: translate3d(2px, 0, 0) scale(1); }
        30%, 50%, 70% { transform: translate3d(-3px, 0, 0) scale(1); }
        40%, 60% { transform: translate3d(3px, 0, 0) scale(1); }
      }
      .animate-shake {
        animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
      }
      .card-container {
        perspective: 1000px;
      }
      .card-flipper {
          position: relative;
          width: 100%;
          height: 100%;
          transition: transform 0.8s;
          transform-style: preserve-3d;
      }
      .card-flipper.is-flipped {
          transform: rotateY(180deg);
      }
      .card-face {
          position: absolute;
          width: 100%;
          height: 100%;
          -webkit-backface-visibility: hidden; /* Safari */
          backface-visibility: hidden;
      }
      .card-back {
          transform: rotateY(180deg);
      }
      @keyframes pulse {
        from { opacity: 1; transform: scale(1); }
        to   { opacity: 0.6; transform: scale(1.18); }
      }
      /* Card transfer animations */
      @keyframes card-fly-right {
        0%   { transform: translateX(0) scale(1);   opacity: 1; }
        60%  { transform: translateX(80px) scale(.7); opacity: .7; }
        100% { transform: translateX(140px) scale(.25); opacity: 0; }
      }
      @keyframes card-fly-left {
        0%   { transform: translateX(0) scale(1);    opacity: 1; }
        60%  { transform: translateX(-80px) scale(.7); opacity: .7; }
        100% { transform: translateX(-140px) scale(.25); opacity: 0; }
      }
      @keyframes card-fly-up {
        0%   { transform: translateY(0) scale(1);    opacity: 1; }
        60%  { transform: translateY(-60px) scale(.7); opacity: .7; }
        100% { transform: translateY(-120px) scale(.25); opacity: 0; }
      }
      @keyframes card-fly-down {
        0%   { transform: translateY(0) scale(1);   opacity: 1; }
        60%  { transform: translateY(60px) scale(.7); opacity: .7; }
        100% { transform: translateY(120px) scale(.25); opacity: 0; }
      }
      @keyframes winner-glow {
        0%   { filter: brightness(1); }
        40%  { filter: brightness(1.25) drop-shadow(0 0 18px #f4c349); }
        100% { filter: brightness(1); }
      }
      .card-transfer-fly-right { animation: card-fly-right 0.65s ease-in forwards; }
      .card-transfer-fly-left  { animation: card-fly-left  0.65s ease-in forwards; }
      .card-transfer-fly-up    { animation: card-fly-up    0.65s ease-in forwards; }
      .card-transfer-fly-down  { animation: card-fly-down  0.65s ease-in forwards; }
      .card-winner-glow        { animation: winner-glow    0.75s ease-out forwards; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.1/",

  }
}
</script>
</head>

  </body>
</html>
